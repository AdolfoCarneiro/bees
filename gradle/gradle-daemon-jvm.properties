# Pins the Gradle daemon JVM to Java 21.
# Groovy 3.0.x (bundled in Gradle 8.10.x) uses an ASM version that cannot parse
# class files compiled with Java 23+ (major version >= 67). Running the daemon on
# JDK 25 breaks build-script compilation for any module that uses ModDevGradle.
# This file (supported since Gradle 8.8) tells Gradle to find or provision JDK 21.
toolchainVersion=21
